<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루만에 익히는 Agent 개발 Demo</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  /* 한 화면 홈: 오른쪽 위에서 API 키를 연결하고, 같은 화면에서 실습 네 가지를 바로 고른다 */
  body{min-height:100vh}
  .top{position:relative;display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap;padding:14px clamp(16px,3vw,40px);border-bottom:2px solid var(--ink)}
  .top .brand{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1.15;letter-spacing:-.01em}
  .top .sp{flex:1}
  .keyform{display:flex;align-items:center;gap:8px;min-width:0}
  .keybox{display:flex;align-items:center;width:clamp(220px,28vw,380px);border:2px solid var(--ink);border-radius:6px;background:var(--white);box-shadow:3px 3px 0 var(--shadow,var(--ink));overflow:hidden}
  .keybox:focus-within{border-color:var(--cobalt)}
  .keybox input{flex:1;min-width:0;border:0;padding:9px 12px;background:transparent;font-family:var(--font);font-size:15px;outline:none}
  .keybox button{border:0;background:transparent;padding:0 12px;font-weight:700;color:var(--muted);cursor:pointer;align-self:stretch}
  .keybox button:hover{color:var(--ink)}
  .linked{display:flex;align-items:center;gap:10px;font-weight:700}
  .linked .dot{flex:none}
  .linked span{font-family:var(--font)}
  [hidden]{display:none!important}

  /* 연결 결과 안내: 키 입력 바로 아래, 오른쪽 위에 뜬다 */
  .status{position:absolute;right:clamp(16px,3vw,40px);top:calc(100% + 10px);z-index:30;max-width:min(520px,calc(100% - 32px));
          padding:10px 14px;border:2px solid var(--ink);border-left-width:8px;border-radius:6px;background:var(--white);box-shadow:4px 4px 0 var(--shadow,var(--ink));font-size:14px}
  .status:empty{display:none}
  .status.err{border-left-color:var(--coral)} .status.ok{border-left-color:var(--mint);font-weight:700}
  .status b{display:block}
  .status code{display:block;margin-top:4px;font:500 12px var(--font);color:var(--muted);overflow-wrap:anywhere}

  /* 실습 네 가지: 연결 전에는 잠겨 있고(흐리게), 연결되면 켜져서 누를 수 있다 */
  .home{padding:clamp(14px,2.4vh,28px) clamp(16px,3vw,40px)}
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:0 auto}
  .tile{display:flex;flex-direction:column;min-height:0;text-decoration:none;color:inherit;background:var(--white);cursor:default}
  .tile .thumb{aspect-ratio:16/10;overflow:hidden;filter:grayscale(1) contrast(.8);opacity:.38;transition:filter .6s,opacity .6s}
  .tile .thumb svg{width:100%;height:100%;display:block}
  .tile .foot{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:2px solid var(--ink);font-weight:700}
  .tile .foot b{font-weight:700;color:var(--muted);transition:color .4s}
  .tile .foot .go{margin-left:auto;opacity:0;transition:opacity .4s}
  .tiles.lit .tile{cursor:pointer}
  .tiles.lit .thumb{filter:none;opacity:1}
  .tiles.lit .foot b{color:var(--ink)}
  .tiles.lit .foot .go{opacity:1}
  .tiles.lit .tile:nth-child(2) .thumb{transition-delay:.2s}
  .tiles.lit .tile:nth-child(3) .thumb{transition-delay:.4s}
  .tiles.lit .tile:nth-child(4) .thumb{transition-delay:.6s}
  .tiles.lit .tile:hover,.tiles.lit .tile:focus-visible{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
  .tile.nudge{animation:nudge .35s}
  @keyframes nudge{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}

  /* 한 화면 구성: 넓은 화면에서는 위쪽 줄 아래 남는 높이를 2×2가 채운다.
     타일 폭은 남는 높이에서 계산해(cqh) 썸네일 16:10 비율이 찌그러지지 않게 한다. */
  @media(min-width:721px){
    body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    .top{flex:none}
    .home{flex:1;min-height:0;container-type:size}
    .tiles{height:100%;grid-template-rows:repeat(2,minmax(0,1fr));align-content:center;
           width:min(100%,calc((100cqh - 20px - 2*46px) / 2 * 1.6 * 2 + 20px));max-height:100%}
    .tile .thumb{aspect-ratio:auto;flex:1;min-height:0}
    .tile .thumb svg{height:100%}
    .tiles{align-content:stretch}
  }
  @media(max-width:720px){
    .keyform{flex-wrap:wrap;width:100%}
    .keybox{flex:1;width:auto}
    .top .sp{display:none}
  }
</style>
<link rel="stylesheet" href="assets/console-colors.css">
</head>
<body>
<header class="top">
  <div class="brand">하루만에 익히는 Agent 개발 Demo</div>
  <div class="sp"></div>
  <form id="f" class="keyform" novalidate>
    <label for="key" class="sr">Claude API 키</label>
    <div class="keybox">
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Claude API 키 (sk-ant-...)" aria-describedby="st">
      <button type="button" id="eye" aria-label="키 표시">표시</button>
    </div>
    <button class="btn blue" id="go" type="submit">연결 테스트</button>
  </form>
  <div class="linked" id="linked" hidden><i class="dot"></i><span id="mask"></span><button type="button" class="btn ghost sm" id="disconnect">연결 해제</button></div>
  <div id="st" class="status" role="status" aria-live="polite"></div>
</header>

<main class="home">
  <h1 class="sr">실습 목록</h1>
  <div class="tiles" id="tiles"></div>
</main>

<script src="assets/common.js"></script>
<script>
const { LABS, thumbs, store, $, esc } = App;
const key = $('#key'), st = $('#st'), go = $('#go'), tiles = $('#tiles');

// 실습 네 가지: 서버가 아니라 LABS 목록으로 그린다. 연결되기 전에는 누를 수 없다.
tiles.innerHTML = LABS.map(l => `<a class="tile panel" data-file="${l.file}" aria-disabled="true" tabindex="-1">
  <div class="thumb">${thumbs[l.id]}</div>
  <div class="foot"><span class="tag">${l.ch}</span><b>${esc(l.title)}</b>
    <svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div></a>`).join('');

// 연결 상태를 화면에 반영한다: 켜짐이면 실습 링크가 열리고, 꺼짐이면 키 입력 칸이 보인다
function render(on) {
  tiles.classList.toggle('lit', on);
  $('#f').hidden = on; $('#linked').hidden = !on;
  $('#mask').textContent = on ? App.maskKey() : '';
  tiles.querySelectorAll('.tile').forEach(t => {
    if (on) { t.href = t.dataset.file; t.removeAttribute('aria-disabled'); t.tabIndex = 0; }
    else { t.removeAttribute('href'); t.setAttribute('aria-disabled', 'true'); t.tabIndex = -1; }
  });
}

// 잠겨 있을 때 실습을 누르면 키 입력으로 안내한다
tiles.addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t || App.hasAccess()) return;
  e.preventDefault(); t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge');
  fail('API 키를 먼저 연결해 주세요.', '오른쪽 위 입력칸에 Claude API 키를 넣고 연결 테스트를 누르면 실습 네 가지가 켜집니다.'); key.focus();
});

$('#eye').onclick = e => {
  const show = key.type === 'password';
  key.type = show ? 'text' : 'password';
  e.target.textContent = show ? '숨기기' : '표시';
  e.target.setAttribute('aria-label', show ? '키 숨기기' : '키 표시');
};

function fail(title, detail) {
  st.className = 'status err';
  st.innerHTML = `<b>${esc(title)}</b>${detail ? `<code>${esc(detail)}</code>` : ''}`;
}

// 서버(/api/key-test)가 Claude API를 1회 호출해 키를 확인한다. 키는 서버에 저장되지 않는다.
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const k = key.value.trim();
  if (!k) return fail('API 키를 입력해 주세요.', 'Anthropic 콘솔에서 발급한 sk-ant- 로 시작하는 키가 필요합니다.');
  if (!k.startsWith('sk-ant-')) return fail('키 형식이 올바르지 않습니다.', 'Claude API 키는 sk-ant- 로 시작합니다. 복사할 때 앞뒤가 잘리지 않았는지 확인해 주세요.');
  go.disabled = true; go.textContent = '연결 중'; st.className = 'status'; st.textContent = '';
  try {
    store.set('apiKey', k);
    await App.api('/api/key-test', { method: 'POST' });
    key.value = ''; render(true);
    st.className = 'status ok'; st.textContent = '연결되었습니다. 실습을 골라 주세요.';
    setTimeout(() => { if (st.classList.contains('ok')) { st.className = 'status'; st.textContent = ''; } }, 3500);
  } catch (err) {
    store.clear(); render(false);
    fail(err.message, err.detail);
  } finally { go.disabled = false; go.textContent = '연결 테스트'; }
});

$('#disconnect').onclick = () => { store.clear(); st.className = 'status'; st.textContent = ''; render(false); key.focus(); };

// 실습 화면에서 돌아왔을 때는 이미 연결된 상태로 보여 준다 (이 탭에서 연결한 키가 남아 있으면)
render(App.hasAccess());
if (!App.hasAccess()) key.focus();
</script>
</body>
</html>
